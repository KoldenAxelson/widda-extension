  <div class="widda-body">
    <p id="notice-operator" class="notice" role="status" hidden></p>
    <p id="notice-sync" class="notice" role="status" hidden></p>

    <ul id="creators" aria-label="Ranked creators"></ul>
    <div id="empty" class="empty" hidden>
      No creators yet. Refresh to pull in the channels you're subscribed to.
    </div>

    <div class="actions">
      <button id="signin">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>

        Sign in with Google

      <button id="refresh">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 0 1-9.6 3.7M2.5 8a5.5 5.5 0 0 1 9.6-3.7"/><path d="M12.5 1.5v3h-3M3.5 14.5v-3h3"/></svg>
        Refresh
      </button>
    </div>
    <p class="hint">Drag to reorder. At checkout, the highest-ranked creator with a promo for that site wins.</p>
    <p class="footer-links">
      <a href="https://widda.club/privacy/" target="_blank" rel="noopener">Privacy</a>
      <button id="delete" type="button" class="link-danger" hidden>Delete my data</button>
    </p>
  </div>

  <script src="dist/popup.js"></script>
